---
version: 3

images:
  base_image:
    # The blog post uses an EE base image from a private registry. This repo uses the public,
    # RHEL-based UBI 9 image so anyone can build it. Replace it with your own base image.
    name: registry.access.redhat.com/ubi9/ubi:latest

dependencies:
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11
  ansible_core:
    package_pip: ansible-core>=2.16,<2.17
  ansible_runner:
    package_pip: ansible-runner
  galaxy:
    collections:
      - name: /build/ansible_collections/automation/kubernetes_platform
        type: dir

additional_build_files:
  - src: ansible_collections
    dest: ansible_collections
  - src: playbooks
    dest: playbooks

additional_build_steps:
  append_final:
    - COPY _build/playbooks /playbooks

options:
  package_manager_path: /usr/bin/dnf
